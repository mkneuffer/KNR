<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Ready to integrate AI into your business? Contact KNR Enterprises to book a free consultation and discover how intelligent systems can drive your growth.">
    <meta property="og:title" content="Contact KNR Enterprises — Book a Consultation">
    <meta property="og:description" content="Ready to integrate AI into your business? Contact KNR Enterprises to book a free consultation and discover how intelligent systems can drive your growth.">
    <meta property="og:image" content="images/KNR.png">
    <meta property="og:url" content="https://www.knrenterprises.com/contact.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <title>Contact KNR Enterprises — Book a Consultation</title>
    <link rel="canonical" href="https://www.knrenterprises.com/contact.html">
    <link rel="icon" type="image/png" href="images/KNR.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script type="text/javascript">var submitted = false;</script>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.knrenterprises.com"},
        {"@type": "ListItem", "position": 2, "name": "Contact", "item": "https://www.knrenterprises.com/contact.html"}
      ]
    }
    </script>
</head>

<body>
    <nav class="navbar">
        <div class="scroll-progress-container">
            <div class="scroll-progress-bar" id="scroll-progress"></div>
        </div>
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="images/KNR.png" alt="KNR Enterprises Logo" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active btn-nav">Contact Us</a></li>
            </ul>
            <div class="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Get in Touch</h1>
            <p>Let's build something intelligent. Tell us about your goals.</p>
        </div>
    </header>

    <section class="contact-page-section">
        <div class="container contact-wrapper">
            <!-- Hidden iframe to hold Google Form response to prevent redirection -->
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"
                onload="if(submitted) {document.getElementById('contact-form-container').style.display='none'; document.getElementById('success-message').style.display='block';}"></iframe>

            <div id="contact-form-container">
                <form class="contact-form"
                    action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSd8kVvWbR36EWoD21Z8HsrsvF7th0LyZxem1yoebe-e4NJyVg/formResponse"
                    method="POST" target="hidden_iframe" onsubmit="submitted=true;">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="entry.1428118814" required placeholder="Full Name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="entry.2072546189" required placeholder="Email Address">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number (Optional)</label>
                        <input type="tel" id="phone" name="entry.74069093" placeholder="+1 (555) 000-0000">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="entry.1852604003" required placeholder="Project Inquiry">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="entry.457220948" rows="5" required
                            placeholder="Tell us about your project..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>

            <!-- Success Message Container -->
            <div id="success-message" style="display:none; text-align:center; padding: 2rem 0;">
                <div style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;">&#10003;</div>
                <h2 style="color: var(--secondary); margin-bottom: 1rem;">Message Sent!</h2>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Thank you for getting in touch. We will
                    get back to you shortly.</p>
                <button onclick="window.location.reload();" class="btn btn-secondary">Send Another Message</button>
            </div>
        </div>
    </section>

    <footer>
        <div class="container footer-content">
            <div class="footer-brand">
                <p>KNR Enterprises</p>
                <span class="copyright">&copy; <span id="year">2026</span> KNR Enterprises. All rights reserved.</span>
            </div>
            <div class="footer-links">
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
